<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Portal - Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-header h1 {
            color: #2563eb;
            margin-bottom: 0.5rem;
        }
        
        .auth-header p {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            font-weight: 500;
            color: #374151;
        }
        
        .form-group input {
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .auth-button {
            background: #2563eb;
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .auth-button:hover {
            background: #1d4ed8;
        }
        
        .auth-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .auth-toggle {
            text-align: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
        }
        
        .auth-toggle button {
            background: none;
            border: none;
            color: #2563eb;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        .auth-toggle button:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #fecaca;
            margin-bottom: 1rem;
            display: none;
        }
        
        .success-message {
            background: #f0fdf4;
            color: #16a34a;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #bbf7d0;
            margin-bottom: 1rem;
            display: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #6b7280;
        }
        
        .password-requirements {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🔐 Document Portal</h1>
            <p id="auth-subtitle">Sign in to access your documents</p>
        </div>
        
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <!-- Login Form -->
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" required>
            </div>
            
            <button type="submit" class="auth-button" id="login-button">
                Sign In
            </button>
            
            <div id="login-loading" class="loading">Signing in...</div>
        </form>
        
        <!-- Register Form -->
        <form id="register-form" class="auth-form" style="display: none;">
            <div class="form-group">
                <label for="register-username">Username</label>
                <input type="text" id="register-username" name="username" required minlength="3">
            </div>
            
            <div class="form-group">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="register-first-name">First Name</label>
                <input type="text" id="register-first-name" name="first_name">
            </div>
            
            <div class="form-group">
                <label for="register-last-name">Last Name</label>
                <input type="text" id="register-last-name" name="last_name">
            </div>
            
            <div class="form-group">
                <label for="register-password">Password</label>
                <input type="password" id="register-password" name="password" required minlength="8">
                <div class="password-requirements">
                    Password must be at least 8 characters long
                </div>
            </div>
            
            <button type="submit" class="auth-button" id="register-button">
                Create Account
            </button>
            
            <div id="register-loading" class="loading">Creating account...</div>
        </form>
        
        <div class="auth-toggle">
            <button type="button" id="toggle-auth">
                Don't have an account? Sign up
            </button>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        
        // Toggle between login and register forms
        document.getElementById('toggle-auth').addEventListener('click', function() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const subtitle = document.getElementById('auth-subtitle');
            const toggleButton = document.getElementById('toggle-auth');
            
            if (isLoginMode) {
                // Switch to register
                loginForm.style.display = 'none';
                registerForm.style.display = 'flex';
                subtitle.textContent = 'Create your account';
                toggleButton.textContent = 'Already have an account? Sign in';
                isLoginMode = false;
            } else {
                // Switch to login
                registerForm.style.display = 'none';
                loginForm.style.display = 'flex';
                subtitle.textContent = 'Sign in to access your documents';
                toggleButton.textContent = 'Don\'t have an account? Sign up';
                isLoginMode = true;
            }
            
            // Clear messages
            hideMessages();
        });
        
        // Handle login form submission
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            await handleAuth('/auth/login', { username, password }, 'login');
        });
        
        // Handle register form submission
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                username: document.getElementById('register-username').value,
                email: document.getElementById('register-email').value,
                password: document.getElementById('register-password').value,
                first_name: document.getElementById('register-first-name').value,
                last_name: document.getElementById('register-last-name').value
            };
            
            await handleAuth('/auth/register', formData, 'register');
        });
        
        async function handleAuth(endpoint, data, mode) {
            const loadingId = `${mode}-loading`;
            const buttonId = `${mode}-button`;
            
            console.log(`Handling ${mode} request to ${endpoint}`);
            
            // Show loading
            document.getElementById(loadingId).style.display = 'block';
            document.getElementById(buttonId).disabled = true;
            hideMessages();
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    if (mode === 'login') {
                        console.log('Login successful, storing token and redirecting...');
                        // Store token and redirect
                        localStorage.setItem('access_token', result.access_token);
                        localStorage.setItem('user', JSON.stringify(result.user));
                        showSuccess('Login successful! Redirecting...');
                        
                        // Simple redirect after login
                        setTimeout(() => {
                            console.log('Redirecting to /...');
                            window.location.href = '/';
                        }, 1000);
                    } else {
                        // Registration successful
                        showSuccess('Account created successfully! Please sign in.');
                        // Switch to login form
                        document.getElementById('toggle-auth').click();
                    }
                } else {
                    showError(result.detail || 'An error occurred');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            } finally {
                // Hide loading
                document.getElementById(loadingId).style.display = 'none';
                document.getElementById(buttonId).disabled = false;
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
        
        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }
        
        // Don't auto-check authentication on login page - let the user login manually
        // This prevents the infinite loop
    </script>
</body>
</html>
